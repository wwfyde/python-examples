[project]
name = "python-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "addict>=2.4.0",
    "altair>=5.4.1",
    "bokeh>=3.6.0",
    "claude-agent-sdk>0.2",
    "datasets>=3.0.0",
    "fastapi[all]>=0.135.0",
    "google-genai>=2",
    "jupyterlab",
    "langchain>=1.2.7",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "libs-config",
    "libs-image-utils",
    "markitdown[all]>=0.1.5",
    "matplotlib>=3.9.2",
    "nacos-sdk-python>=3.0.4",
    "nanoid>=2.0.0",
    "notebook>=7.2.2",
    "numpy>=2.1.1",
    "openai",
    "pillow>=12.0.0",
    "plotly>=5.24.1",
    "polars>=1.9.0",
    "python-dotenv>=1.0.1",
    "redis>=7.4.0",
    # "torch>=2.5.1",
    #    "torchvision>=0.20.1",
    #    "torchaudio>=2.5.1",
    "segment-anything>=1.0",
    "starlette>=1.0.0",
    "subapp",
    "tenacity>=9.0.0",
    "timm>=1.0.18",
    "transformers>=4.57.1",
    "ulid-py>=1.1.0",
    "websockets>=16",
    "yapf>=0.43.0",
]

[dependency-groups]
dev = [
    "ipython>=8.31.0",
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.4",
    "notebook>=7.3.2",
    "pip>=24.3.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "uv-build>=0.9.2",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
# https://docs.astral.sh/ruff/settings/
line-length = 100
# ignore = ["E731"]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "F841",
    "F401",  # remove unused imports
]

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions", "pydantic", "openai"]
known-first-party = ["api", "lib"]
known-third-party = ["fastapi"]

[tool.ruff.format]
preview = true
exclude = [
    "F841",  # Ignore unused variable warnings
    "E501",  # Ignore line length warnings
    "F401",  # remove unused imports
]

[tool.tombi.format.rules]
indent-style = "space"
indent-sub-tables = false
indent-table-key-value-pairs = false
indent-width = 4
line-width = 100

[tool.uv]
package = false

override-dependencies = [
    "numpy>2",
]

[tool.uv.workspace]
members = [
    "stdlib",
    "best-practices",
    "hot-packages",
    "type-system",
    "concurrent-programming",
    "data-processing",
    "redis-usage",
    "rabbitmq-usage",
    "file-processing",
    "oop",
    "document-processing",
    "usages",
    "profiling",
    "interview",
    "llm-notes",
    "performance-diagnostics",
    "subapp",
    "language-features",
    "ecosystem",
    "toolchain",
    # "llm-examples",
    "libs/image-utils",
    "libs/config",
    "use-image",
    "prompts",
    "examples/app",
    "office",
    "python-features",
]

[tool.uv.sources]
lib = { path = "../python-project-template/lib", editable = true }
subapp = { workspace = true }
# examples = { path = "./examples", editable = true }
libs-image-utils = { workspace = true }
libs-config = { workspace = true }
